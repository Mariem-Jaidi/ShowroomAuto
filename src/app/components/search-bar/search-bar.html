<div class="search-section">

    <!-- Brand search (existing) -->
    <div class="container">
        <label>Brand</label>
        <input type="text" #brand name="brand" placeholder="Mercedes, Audi, BMW..."
        (input)="selectAutos(brand.value); modelSel.value = ''">
        <fa-icon [icon]="faMagnifyingGlass" />
    </div>

    <!-- Filters row -->
    <div class="filters-row">

        <!-- Model filter dropdown -->
        <div class="filter-group">
            <label>Model</label>
            <select #modelSel (change)="filterByModel(modelSel.value)">
                <option value="">All models</option>
                @for(model of getModels(); track model){
                    <option [value]="model">{{model}}</option>
                }
            </select>
        </div>

        <!-- Power filter dropdown -->
        <div class="filter-group">
            <label>Power</label>
            <select #powerSel (change)="filterByPower(powerSel.value)">
                <option value="">All</option>
                <option value="low">&lt; 10 CV</option>
                <option value="mid">10 - 15 CV</option>
                <option value="high">&gt; 15 CV</option>
            </select>
        </div>

        <!-- Sort dropdown (price + power) -->
        <div class="filter-group">
            <label>Sort by</label>
            <select #sortSel (change)="sortCars(sortSel.value)">
                <option value="">Default</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="power-asc">Power: Low to High</option>
                <option value="power-desc">Power: High to Low</option>
            </select>
        </div>

        <!-- Reset -->
        <div class="filter-group">
            <label>&nbsp;</label>
            <button class="reset-btn" (click)="resetFilters(brand, modelSel, powerSel, sortSel)">Reset filters</button>
        </div>

    </div>

</div>

<p class="results-count">{{selectedAutos.length}} car(s) found</p>

<div class="cars-container">
    @for(auto of selectedAutos; track auto.id){
        <div class="auto-card">
            <img [src]="`images/${auto.photo}`">
            <div class="details">
                <h3>{{auto.brand}} {{auto.model}}</h3>
                <p>
                    Power : {{auto.power}} CV<br>
                    Price : {{auto.price}} TND<br>
                    Only {{auto.availability}} units in stock 
                </p>
            </div>
            <div class="see_more">
                <button (click)="selectCar(auto)">See More...</button>
            </div>
        </div>
    } @empty {
        <div class="empty-state">
            <p>No car matches your filters</p>
        </div>
    }
</div>
